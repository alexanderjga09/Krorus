name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --workspace

      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Las extensiones Rust deben instalarse ANTES de los tests: la suite
      # importa chainlog_rs / exif_rs y, sin ellas, los tests se saltaban en
      # silencio (antes con `|| true` el build nunca fallaba ante regresiones).
      - name: Build and install Rust extensions
        run: |
          . .venv/bin/activate
          pip install maturin
          (cd crates/chainlog_rs && maturin develop --release)
          (cd crates/exif_rs && maturin develop --release)

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Run Python tests
        run: |
          . .venv/bin/activate
          pytest tests/
